name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (flight logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  e2e:
    name: end-to-end (Gazebo in Docker)
    runs-on: ubuntu-latest
    # Building the image pulls ROS 2 and Gazebo, which is the slow step here.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      # --wait returns only once the healthcheck passes, which means Gazebo is
      # up and the bridge is serving the drone pose.
      - name: Start Gazebo and the bridge
        run: docker compose up -d --build --wait

      - run: npx playwright test

      - name: Gazebo and bridge logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the container
        if: always()
        run: docker compose down
